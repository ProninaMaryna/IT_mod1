[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-folder"
version = "1.0.0"
description = "Хмарне сховище: сервер FastAPI, десктоп-клієнт PySide6 і веб-клієнт Vue 3"
readme = "README.md"
requires-python = ">=3.11"
# залежності сервера; саме їх встановлює Docker-образ
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
desktop = [
    "httpx>=0.27",
    "PySide6>=6.6",
]
# тести та демо-дані (scripts/seed_demo.py малює зразки .png)
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "pillow>=10",
]

[tool.setuptools.packages.find]
include = ["cloudfolder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
